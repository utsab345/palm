[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
"app/dependencies.py" = ["B008"]
"app/services/booking_service.py" = ["DTZ007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
